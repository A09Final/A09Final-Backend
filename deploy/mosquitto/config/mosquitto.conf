# Mosquitto configuration for BeforeFire (eclipse-mosquitto:2) on the Mac.

# Every client must log in. scripts/mqtt-user.sh creates the passwd file.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Alert reports are at most 8 KB (alert.MaxReportBytes).
max_packet_size 16384

# One listener for the backend container and the ESP32 boards on the home
# Wi-Fi. It has no TLS. Add a TLS listener before the broker is reachable
# from the internet.
listener 1883
